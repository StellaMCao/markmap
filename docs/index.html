<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markmap REPL</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-2: #eef2f6;
      --text: #17202a;
      --muted: #64748b;
      --border: #d6dee8;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100%;
    }

    header {
      align-items: center;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 14px;
      justify-content: space-between;
      padding: 12px 16px;
    }

    h1 {
      font-size: 18px;
      line-height: 1.2;
      margin: 0;
      white-space: nowrap;
    }

    .actions {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    button {
      appearance: none;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      min-height: 34px;
      padding: 0 11px;
    }

    button.secondary {
      background: var(--panel);
      border-color: var(--border);
      color: var(--text);
    }

    button:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
    }

    button.secondary:hover {
      background: var(--panel-2);
      border-color: var(--border);
    }

    main {
      display: grid;
      grid-template-columns: minmax(280px, 38vw) 1fr;
      min-height: 0;
    }

    .editor,
    .preview {
      min-height: 0;
      position: relative;
    }

    .editor {
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .bar {
      align-items: center;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      display: flex;
      font-size: 13px;
      justify-content: space-between;
      min-height: 34px;
      padding: 0 12px;
    }

    textarea {
      background: transparent;
      border: 0;
      color: var(--text);
      font: 14px/1.55 Consolas, "Liberation Mono", Menlo, monospace;
      min-height: 0;
      outline: 0;
      padding: 16px;
      resize: none;
      width: 100%;
    }

    .preview {
      background: #fbfcfd;
      overflow: hidden;
    }

    svg.markmap {
      display: block;
      height: 100%;
      width: 100%;
    }

    .markmap-node circle {
      cursor: pointer;
    }

    .status {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--border);
      border-radius: 6px;
      bottom: 12px;
      color: var(--muted);
      font-size: 12px;
      left: 12px;
      max-width: calc(100% - 24px);
      padding: 7px 9px;
      position: absolute;
      z-index: 2;
    }

    .status.error { color: var(--danger); }
    .hidden { display: none; }

    @media (max-width: 860px) {
      header { align-items: flex-start; flex-direction: column; }
      .actions { justify-content: flex-start; }
      main {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(260px, 44vh) 1fr;
      }
      .editor { border-bottom: 1px solid var(--border); border-right: 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Markmap REPL</h1>
      <div class="actions">
        <button class="secondary" id="sample" type="button">Ejemplo</button>
        <button class="secondary" id="collapse" type="button">Contraer</button>
        <button class="secondary" id="expand" type="button">Expandir todo</button>
        <button class="secondary" id="fit" type="button">Ajustar</button>
        <button id="save-html" type="button">Guardar HTML</button>
        <button class="secondary" id="save-svg" type="button">Guardar SVG</button>
      </div>
    </header>
    <main>
      <section class="editor" aria-label="Editor Markdown">
        <div class="bar"><span>Markdown</span><span id="count">0 caracteres</span></div>
        <textarea id="markdown" spellcheck="false"></textarea>
      </section>
      <section class="preview" aria-label="Vista previa Markmap">
        <svg class="markmap" id="mindmap"></svg>
        <div class="status" id="status">Cargando Markmap...</div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/lib/common.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12/dist/browser/index.iife.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.min.js"></script>
  <script>
    const sample = `# Markmap\n\n## Escribi Markdown\n\n- Ideas\n- Apuntes\n- Clases\n- Proyectos\n\n## Desplegar y contraer\n\n- Hace clic en el circulo que aparece al final de cada nodo\n- Ctrl + clic contrae o expande toda esa rama\n\n## Exportar\n\n- Guardar HTML conserva la interactividad\n- Guardar SVG crea una imagen vectorial`;

    const cdnScripts = [
      'https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js',
      'https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js',
      'https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/lib/common.min.js',
      'https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12/dist/browser/index.iife.min.js',
      'https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.min.js'
    ];

    const textarea = document.querySelector('#markdown');
    const count = document.querySelector('#count');
    const status = document.querySelector('#status');
    const svg = document.querySelector('#mindmap');
    let transformer;
    let mm;
    let renderTimer;
    let expandLevel = -1;

    function getMarkmapApi() {
      return window.markmap || null;
    }

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle('hidden', !message);
      status.classList.toggle('error', isError);
    }

    function download(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.append(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function saveMarkdown(value) {
      try { localStorage.setItem('markmap-repl-markdown', value); } catch (error) {}
    }

    function loadInitialMarkdown() {
      try { return localStorage.getItem('markmap-repl-markdown') || sample; }
      catch (error) { return sample; }
    }

    async function render() {
      if (!transformer || !mm) return;
      const markdown = textarea.value.trim() || '# Markmap';
      count.textContent = `${textarea.value.length} caracteres`;
      saveMarkdown(textarea.value);
      try {
        const { root } = transformer.transform(markdown);
        await mm.setData(root, { initialExpandLevel: expandLevel });
        await mm.fit();
        setStatus('Para desplegar o contraer una rama, hace clic en el circulo del nodo. Ctrl + clic aplica a toda esa rama.');
      } catch (error) {
        setStatus(error.message || 'No se pudo renderizar el mapa.', true);
      }
    }

    function scheduleRender() {
      clearTimeout(renderTimer);
      renderTimer = setTimeout(render, 160);
    }

    function exportSvg() {
      const clone = svg.cloneNode(true);
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      download('markmap.svg', new XMLSerializer().serializeToString(clone), 'image/svg+xml;charset=utf-8');
    }

    function exportedHtml(markdown) {
      const safeMarkdown = JSON.stringify(markdown).replace(/</g, '\\u003c');
      const scripts = cdnScripts.map((src) => `<script src="${src}"><\/script>`).join('\n');
      return `<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markmap</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fbfcfd;color:#17202a}header{align-items:center;background:#fff;border-bottom:1px solid #d6dee8;display:flex;gap:8px;justify-content:space-between;min-height:48px;padding:8px 12px}h1{font-size:16px;margin:0}button{background:#fff;border:1px solid #d6dee8;border-radius:6px;color:#17202a;cursor:pointer;font:inherit;font-size:14px;min-height:32px;padding:0 10px}#mindmap{display:block;height:calc(100vh - 48px);width:100vw}.markmap-node circle{cursor:pointer}.hint{color:#64748b;font-size:12px}
</style>
</head>
<body>
<header><h1>Markmap</h1><div><button id="collapse">Contraer</button> <button id="expand">Expandir todo</button> <button id="fit">Ajustar</button> <span class="hint">clic en circulos de nodos para desplegar/contraer</span></div></header>
<svg id="mindmap"></svg>
${scripts}
<script>
const markdown = ${safeMarkdown};
const api = window.markmap;
const svg = document.querySelector('#mindmap');
const transformer = new api.Transformer();
const mm = api.Markmap.create(svg, { autoFit: true, duration: 180, initialExpandLevel: -1 });
async function draw(level = -1) {
  const { root } = transformer.transform(markdown);
  await mm.setData(root, { initialExpandLevel: level });
  await mm.fit();
}
document.querySelector('#fit').addEventListener('click', () => mm.fit());
document.querySelector('#collapse').addEventListener('click', () => draw(2));
document.querySelector('#expand').addEventListener('click', () => draw(-1));
window.addEventListener('resize', () => mm.fit());
draw();
<\/script>
</body>
</html>`;
    }

    function exportHtml() {
      download('markmap.html', exportedHtml(textarea.value), 'text/html;charset=utf-8');
    }

    function boot() {
      const api = getMarkmapApi();
      if (!window.d3 || !api || !api.Transformer || !api.Markmap) {
        const keys = api ? Object.keys(api).join(', ') : 'sin window.markmap';
        setStatus(`No se cargaron las librerias de Markmap. Detalle: ${keys}. Proba Ctrl + F5.`, true);
        return;
      }
      transformer = new api.Transformer();
      mm = api.Markmap.create(svg, { autoFit: true, duration: 180, initialExpandLevel: -1 });
      textarea.value = loadInitialMarkdown();
      textarea.addEventListener('input', scheduleRender);
      document.querySelector('#fit').addEventListener('click', () => mm.fit());
      document.querySelector('#sample').addEventListener('click', () => {
        textarea.value = sample;
        expandLevel = -1;
        render();
        textarea.focus();
      });
      document.querySelector('#collapse').addEventListener('click', () => {
        expandLevel = 2;
        render();
      });
      document.querySelector('#expand').addEventListener('click', () => {
        expandLevel = -1;
        render();
      });
      document.querySelector('#save-html').addEventListener('click', exportHtml);
      document.querySelector('#save-svg').addEventListener('click', exportSvg);
      window.addEventListener('resize', () => mm.fit());
      render();
    }

    window.addEventListener('load', boot);
  </script>
</body>
</html>

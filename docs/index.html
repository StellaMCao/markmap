<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markmap REPL</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-2: #eef2f6;
      --text: #17202a;
      --muted: #64748b;
      --border: #d6dee8;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --danger: #b42318;
      --map-font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    [data-theme="dark"] {
      --bg: #111827;
      --panel: #182235;
      --panel-2: #223047;
      --text: #edf2f7;
      --muted: #aab6c7;
      --border: #334155;
      --accent: #2dd4bf;
      --accent-dark: #14b8a6;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app { display: grid; grid-template-rows: auto 1fr; min-height: 100%; }
    header {
      align-items: center;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 14px;
      justify-content: space-between;
      padding: 12px 16px;
    }
    h1 { font-size: 18px; line-height: 1.2; margin: 0; white-space: nowrap; }
    .actions { align-items: center; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    label { align-items: center; color: var(--muted); display: inline-flex; font-size: 13px; gap: 6px; }
    select {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font: inherit;
      font-size: 13px;
      min-height: 34px;
      padding: 0 8px;
    }
    button {
      appearance: none;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: #06201d;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      min-height: 34px;
      padding: 0 11px;
    }
    [data-theme="light"] button { color: #fff; }
    button.secondary { background: var(--panel); border-color: var(--border); color: var(--text); }
    button:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
    button.secondary:hover { background: var(--panel-2); border-color: var(--border); }
    input[type="file"] { display: none; }
    main { display: grid; grid-template-columns: minmax(280px, 38vw) 1fr; min-height: 0; }
    .editor, .preview { min-height: 0; position: relative; }
    .editor { background: var(--panel); border-right: 1px solid var(--border); display: grid; grid-template-rows: auto 1fr; }
    .bar {
      align-items: center;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      display: flex;
      font-size: 13px;
      justify-content: space-between;
      min-height: 34px;
      padding: 0 12px;
    }
    textarea {
      background: transparent;
      border: 0;
      color: var(--text);
      font: 14px/1.55 Consolas, "Liberation Mono", Menlo, monospace;
      min-height: 0;
      outline: 0;
      padding: 16px;
      resize: none;
      width: 100%;
    }
    .preview { background: color-mix(in srgb, var(--panel) 55%, var(--bg)); overflow: hidden; }
    svg.markmap { display: block; height: 100%; width: 100%; }
    .markmap-node circle { cursor: pointer; }
    .markmap-foreign div { font-family: var(--map-font); }
    .markmap-foreign img { border-radius: 6px; max-height: 120px; max-width: 220px; object-fit: contain; }
    .status {
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      border: 1px solid var(--border);
      border-radius: 6px;
      bottom: 12px;
      color: var(--muted);
      font-size: 12px;
      left: 12px;
      max-width: calc(100% - 24px);
      padding: 7px 9px;
      position: absolute;
      z-index: 2;
    }
    .status.error { color: var(--danger); }
    .hidden { display: none; }
    @media (max-width: 1120px) { header { align-items: flex-start; flex-direction: column; } .actions { justify-content: flex-start; } }
    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; grid-template-rows: minmax(260px, 44vh) 1fr; }
      .editor { border-bottom: 1px solid var(--border); border-right: 0; }
    }
  </style>
</head>
<body data-theme="light">
  <div class="app">
    <header>
      <h1>Markmap REPL</h1>
      <div class="actions">
        <label>Nivel
          <select id="level">
            <option value="-1">Todo abierto</option>
            <option value="2">Nivel 1</option>
            <option value="3">Nivel 2</option>
            <option value="4">Nivel 3</option>
            <option value="5">Nivel 4</option>
          </select>
        </label>
        <label>Color
          <select id="palette">
            <option value="classic">Clasico</option>
            <option value="ocean">Oceano</option>
            <option value="forest">Bosque</option>
            <option value="sunset">Atardecer</option>
            <option value="mono">Mono</option>
          </select>
        </label>
        <label>Fuente
          <select id="font">
            <option value="system">Sistema</option>
            <option value="serif">Serif</option>
            <option value="mono">Mono</option>
            <option value="rounded">Redondeada</option>
          </select>
        </label>
        <label>Tema
          <select id="theme">
            <option value="light">Claro</option>
            <option value="dark">Oscuro</option>
          </select>
        </label>
        <input id="import-file" type="file" accept=".md,.markdown,text/markdown,text/plain">
        <button class="secondary" id="import" type="button">Importar MD</button>
        <button class="secondary" id="sample" type="button">Ejemplo</button>
        <button class="secondary" id="fit" type="button">Ajustar</button>
        <button class="secondary" id="share" type="button">Copiar link</button>
        <button id="save-html" type="button">Guardar HTML</button>
        <button class="secondary" id="save-svg" type="button">Guardar SVG</button>
        <button class="secondary" id="save-png" type="button">Guardar PNG</button>
      </div>
    </header>
    <main>
      <section class="editor" aria-label="Editor Markdown">
        <div class="bar"><span>Markdown</span><span id="count">0 caracteres</span></div>
        <textarea id="markdown" spellcheck="false"></textarea>
      </section>
      <section class="preview" aria-label="Vista previa Markmap">
        <svg class="markmap" id="mindmap"></svg>
        <div class="status" id="status">Cargando Markmap...</div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/lib/common.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12/dist/browser/index.iife.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.min.js"></script>
  <script>
    const sample = `# Markmap avanzado\n\n## Despliegue\n\n- Elegi el nivel inicial arriba\n- Hace clic en el circulo de un nodo para contraer o desplegar\n- Ctrl + clic aplica a toda la rama\n\n## Formulas\n\n- Inline: $E = mc^2$\n- Display compatible: $\\displaystyle \\int_a^b f(x)\\,dx = F(b) - F(a)$\n- Fracciones: $\\frac{a^2 + b^2}{c^2}$\n\n## Enlaces e imagenes\n\n- [Documentacion de Markmap](https://markmap.js.org/docs/markmap)\n- ![Markmap](https://markmap.js.org/favicon.png)\n\n## Codigo\n\n\`\`\`js\nconst mindmap = 'markdown + svg';\nconsole.log(mindmap);\n\`\`\``;

    const scripts = [
      'https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js',
      'https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js',
      'https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/lib/common.min.js',
      'https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12/dist/browser/index.iife.min.js',
      'https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.min.js'
    ];

    const palettes = {
      classic: ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', '#8c564b', '#e377c2', '#17becf'],
      ocean: ['#005f73', '#0a9396', '#94d2bd', '#3a86ff', '#4361ee', '#4895ef'],
      forest: ['#386641', '#6a994e', '#a7c957', '#2d6a4f', '#40916c', '#74c69d'],
      sunset: ['#9b2226', '#bb3e03', '#ca6702', '#ee9b00', '#ae2012', '#e76f51'],
      mono: ['#111827', '#374151', '#4b5563', '#6b7280', '#0f766e']
    };

    const fonts = {
      system: 'Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
      serif: 'Georgia, Cambria, "Times New Roman", serif',
      mono: 'Consolas, "Liberation Mono", Menlo, monospace',
      rounded: '"Trebuchet MS", "Segoe UI", ui-sans-serif, sans-serif'
    };

    const textarea = document.querySelector('#markdown');
    const levelSelect = document.querySelector('#level');
    const paletteSelect = document.querySelector('#palette');
    const fontSelect = document.querySelector('#font');
    const themeSelect = document.querySelector('#theme');
    const fileInput = document.querySelector('#import-file');
    const count = document.querySelector('#count');
    const status = document.querySelector('#status');
    const svg = document.querySelector('#mindmap');
    let transformer;
    let mm;
    let renderTimer;

    function colorFor(paletteName) {
      const colors = palettes[paletteName] || palettes.classic;
      return (node) => colors[Math.max(0, (node.state?.depth || 1) - 1) % colors.length];
    }

    function currentSettings() {
      return {
        level: Number(levelSelect.value),
        palette: paletteSelect.value,
        font: fontSelect.value,
        theme: themeSelect.value
      };
    }

    function applyUiSettings(settings = currentSettings()) {
      document.body.dataset.theme = settings.theme;
      document.documentElement.style.setProperty('--map-font', fonts[settings.font] || fonts.system);
    }

    function markmapOptions(settings = currentSettings()) {
      return {
        autoFit: true,
        duration: 180,
        initialExpandLevel: settings.level,
        color: colorFor(settings.palette),
        maxWidth: 340,
        spacingHorizontal: 78,
        spacingVertical: 7
      };
    }

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle('hidden', !message);
      status.classList.toggle('error', isError);
    }

    function encodeState(markdown, settings) {
      return btoa(unescape(encodeURIComponent(JSON.stringify({ markdown, settings }))));
    }

    function decodeState(hash) {
      if (!hash.startsWith('#m=')) return null;
      try { return JSON.parse(decodeURIComponent(escape(atob(hash.slice(3))))); }
      catch (error) { return null; }
    }

    function persist() {
      try {
        localStorage.setItem('markmap-repl-markdown', textarea.value);
        localStorage.setItem('markmap-repl-settings', JSON.stringify(currentSettings()));
      } catch (error) {}
    }

    function loadSettings(settings = {}) {
      if (settings.level != null) levelSelect.value = String(settings.level);
      if (settings.palette && palettes[settings.palette]) paletteSelect.value = settings.palette;
      if (settings.font && fonts[settings.font]) fontSelect.value = settings.font;
      if (settings.theme === 'dark' || settings.theme === 'light') themeSelect.value = settings.theme;
      applyUiSettings();
    }

    function restore() {
      const shared = decodeState(location.hash);
      if (shared) {
        textarea.value = shared.markdown || sample;
        loadSettings(shared.settings || {});
        return;
      }
      try {
        loadSettings(JSON.parse(localStorage.getItem('markmap-repl-settings') || '{}'));
        textarea.value = localStorage.getItem('markmap-repl-markdown') || sample;
      } catch (error) {
        textarea.value = sample;
        loadSettings();
      }
    }

    function download(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.append(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    async function render() {
      if (!transformer || !mm) return;
      count.textContent = `${textarea.value.length} caracteres`;
      applyUiSettings();
      persist();
      try {
        const { root } = transformer.transform(textarea.value.trim() || '# Markmap');
        await mm.setData(root, markmapOptions());
        await mm.fit();
        setStatus('La expansion y contraccion se hace con clic en los circulos de cada nodo. Ctrl + clic aplica a toda la rama.');
      } catch (error) {
        setStatus(error.message || 'No se pudo renderizar el mapa.', true);
      }
    }

    function scheduleRender() {
      clearTimeout(renderTimer);
      renderTimer = setTimeout(render, 160);
    }

    function exportSvgSource() {
      const clone = svg.cloneNode(true);
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      clone.setAttribute('style', `font-family:${fonts[currentSettings().font] || fonts.system}`);
      return new XMLSerializer().serializeToString(clone);
    }

    function exportSvg() {
      download('markmap.svg', exportSvgSource(), 'image/svg+xml;charset=utf-8');
    }

    function exportPng() {
      const source = exportSvgSource();
      const image = new Image();
      const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      image.onload = () => {
        try {
          const rect = svg.getBoundingClientRect();
          const canvas = document.createElement('canvas');
          const scale = 2;
          canvas.width = Math.max(1, Math.round(rect.width * scale));
          canvas.height = Math.max(1, Math.round(rect.height * scale));
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = getComputedStyle(document.querySelector('.preview')).backgroundColor;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
          canvas.toBlob((png) => {
            URL.revokeObjectURL(url);
            if (!png) {
              setStatus('No se pudo generar el PNG.', true);
              return;
            }
            const pngUrl = URL.createObjectURL(png);
            const link = document.createElement('a');
            link.href = pngUrl;
            link.download = 'markmap.png';
            document.body.append(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(pngUrl);
          }, 'image/png');
        } catch (error) {
          URL.revokeObjectURL(url);
          setStatus('No se pudo generar PNG. Si el mapa incluye imagenes externas, el navegador puede bloquear la exportacion.', true);
        }
      };
      image.onerror = () => {
        URL.revokeObjectURL(url);
        setStatus('No se pudo convertir el SVG a PNG.', true);
      };
      image.src = url;
    }

    function exportedHtml(markdown, settings) {
      const safeMarkdown = JSON.stringify(markdown).replace(/</g, '\\u003c');
      const safeSettings = JSON.stringify(settings).replace(/</g, '\\u003c');
      const scriptTags = scripts.map((src) => `<script src="${src}"><\/script>`).join('\n');
      return `<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markmap</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<style>
:root{--map-font:${fonts[settings.font] || fonts.system}}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:${settings.theme === 'dark' ? '#111827' : '#fbfcfd'};color:${settings.theme === 'dark' ? '#edf2f7' : '#17202a'}}header{align-items:center;background:${settings.theme === 'dark' ? '#182235' : '#fff'};border-bottom:1px solid ${settings.theme === 'dark' ? '#334155' : '#d6dee8'};display:flex;gap:8px;justify-content:space-between;min-height:48px;padding:8px 12px}h1{font-size:16px;margin:0}button{background:transparent;border:1px solid ${settings.theme === 'dark' ? '#334155' : '#d6dee8'};border-radius:6px;color:inherit;cursor:pointer;font:inherit;font-size:14px;min-height:32px;padding:0 10px}#mindmap{display:block;height:calc(100vh - 48px);width:100vw}.markmap-node circle{cursor:pointer}.markmap-foreign div{font-family:var(--map-font)}.markmap-foreign img{border-radius:6px;max-height:120px;max-width:220px;object-fit:contain}.hint{color:${settings.theme === 'dark' ? '#aab6c7' : '#64748b'};font-size:12px}
</style>
</head>
<body>
<header><h1>Markmap</h1><div><button id="fit">Ajustar</button> <span class="hint">clic en circulos para desplegar/contraer</span></div></header>
<svg id="mindmap"></svg>
${scriptTags}
<script>
const markdown = ${safeMarkdown};
const settings = ${safeSettings};
const palettes = ${JSON.stringify(palettes)};
const api = window.markmap;
const svg = document.querySelector('#mindmap');
function colorFor(name){const colors=palettes[name]||palettes.classic;return node=>colors[Math.max(0,(node.state?.depth||1)-1)%colors.length];}
const transformer = new api.Transformer();
const mm = api.Markmap.create(svg, { autoFit: true, duration: 180, initialExpandLevel: settings.level, color: colorFor(settings.palette), maxWidth: 340, spacingHorizontal: 78, spacingVertical: 7 });
async function draw() {
  const { root } = transformer.transform(markdown);
  await mm.setData(root, { initialExpandLevel: settings.level, color: colorFor(settings.palette) });
  await mm.fit();
}
document.querySelector('#fit').addEventListener('click', () => mm.fit());
window.addEventListener('resize', () => mm.fit());
draw();
<\/script>
</body>
</html>`;
    }

    function exportHtml() {
      download('markmap.html', exportedHtml(textarea.value, currentSettings()), 'text/html;charset=utf-8');
    }

    async function copyShareLink() {
      const url = `${location.origin}${location.pathname}#m=${encodeState(textarea.value, currentSettings())}`;
      try {
        await navigator.clipboard.writeText(url);
        setStatus('Link copiado. Puede ser largo si el Markdown es largo.');
      } catch (error) {
        location.hash = `m=${encodeState(textarea.value, currentSettings())}`;
        setStatus('No pude copiar al portapapeles, pero deje el link compartible en la barra de direcciones.');
      }
    }

    function importMarkdown(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        textarea.value = String(reader.result || '');
        render();
      };
      reader.onerror = () => setStatus('No se pudo leer el archivo.', true);
      reader.readAsText(file);
    }

    function boot() {
      const api = window.markmap;
      if (!window.d3 || !api || !api.Transformer || !api.Markmap) {
        const keys = api ? Object.keys(api).join(', ') : 'sin window.markmap';
        setStatus(`No se cargaron las librerias de Markmap. Detalle: ${keys}. Proba Ctrl + F5.`, true);
        return;
      }
      transformer = new api.Transformer();
      mm = api.Markmap.create(svg, markmapOptions());
      restore();
      textarea.addEventListener('input', scheduleRender);
      [levelSelect, paletteSelect, fontSelect, themeSelect].forEach((control) => control.addEventListener('change', render));
      document.querySelector('#fit').addEventListener('click', () => mm.fit());
      document.querySelector('#sample').addEventListener('click', () => { textarea.value = sample; render(); textarea.focus(); });
      document.querySelector('#import').addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', () => importMarkdown(fileInput.files[0]));
      document.querySelector('#share').addEventListener('click', copyShareLink);
      document.querySelector('#save-html').addEventListener('click', exportHtml);
      document.querySelector('#save-svg').addEventListener('click', exportSvg);
      document.querySelector('#save-png').addEventListener('click', exportPng);
      window.addEventListener('resize', () => mm.fit());
      window.addEventListener('hashchange', () => { restore(); render(); });
      render();
    }

    window.addEventListener('load', boot);
  </script>
</body>
</html>

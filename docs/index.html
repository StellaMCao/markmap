<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markmap REPL</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f5f0;
      --panel: #ffffff;
      --panel-2: #f0ece4;
      --text: #1f2933;
      --muted: #6b7280;
      --border: #d8d3ca;
      --accent: #0077b6;
      --accent-dark: #005f8f;
      --shadow: 0 12px 30px rgba(25, 30, 36, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100%;
    }

    header {
      align-items: center;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 16px;
      justify-content: space-between;
      padding: 14px 18px;
    }

    h1 {
      font-size: 18px;
      line-height: 1.2;
      margin: 0;
    }

    .actions {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    button {
      appearance: none;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      min-height: 36px;
      padding: 0 12px;
    }

    button.secondary {
      background: var(--panel);
      border-color: var(--border);
      color: var(--text);
    }

    button:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
    }

    button.secondary:hover {
      background: var(--panel-2);
      border-color: var(--border);
    }

    main {
      display: grid;
      grid-template-columns: minmax(280px, 38vw) 1fr;
      min-height: 0;
    }

    .editor,
    .preview {
      min-height: 0;
      position: relative;
    }

    .editor {
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .bar {
      align-items: center;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      display: flex;
      font-size: 13px;
      justify-content: space-between;
      min-height: 36px;
      padding: 0 12px;
    }

    textarea {
      background: transparent;
      border: 0;
      color: var(--text);
      font: 14px/1.55 Consolas, "Liberation Mono", Menlo, monospace;
      min-height: 0;
      outline: 0;
      padding: 16px;
      resize: none;
      width: 100%;
    }

    .preview {
      background: #fbfaf7;
      overflow: hidden;
    }

    svg.markmap {
      display: block;
      height: 100%;
      width: 100%;
    }

    .status {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid var(--border);
      border-radius: 6px;
      bottom: 12px;
      color: var(--muted);
      font-size: 12px;
      left: 12px;
      max-width: calc(100% - 24px);
      padding: 6px 8px;
      position: absolute;
      z-index: 2;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 820px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      main {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(260px, 42vh) 1fr;
      }

      .editor {
        border-bottom: 1px solid var(--border);
        border-right: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Markmap REPL</h1>
      <div class="actions">
        <button class="secondary" id="reset" type="button">Ejemplo</button>
        <button class="secondary" id="fit" type="button">Ajustar</button>
        <button id="download" type="button">Descargar SVG</button>
      </div>
    </header>
    <main>
      <section class="editor" aria-label="Editor Markdown">
        <div class="bar"><span>Markdown</span><span id="count">0 caracteres</span></div>
        <textarea id="markdown" spellcheck="false"></textarea>
      </section>
      <section class="preview" aria-label="Vista previa Markmap">
        <svg class="markmap" id="mindmap"></svg>
        <div class="status hidden" id="status"></div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12/dist/browser/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js"></script>
  <script>
    const sample = `# Markmap\n\n## Escribi Markdown\n\n- Ideas\n- Apuntes\n- Clases\n- Proyectos\n\n## Se renderiza como mapa mental\n\n### Soporta jerarquia\n\n- Nodo hijo\n- Otro nodo\n\n## Publicado en GitHub Pages\n\nEste REPL corre como una pagina estatica.`;

    const textarea = document.querySelector('#markdown');
    const count = document.querySelector('#count');
    const status = document.querySelector('#status');
    const svg = document.querySelector('#mindmap');
    const transformer = new markmap.Transformer();
    const mm = markmap.Markmap.create(svg, { autoFit: true, duration: 180 });

    let renderTimer;

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle('hidden', !message);
      status.style.color = isError ? '#b42318' : '';
    }

    function saveMarkdown(value) {
      try {
        localStorage.setItem('markmap-repl-markdown', value);
      } catch (error) {
        // Storage can be unavailable in privacy modes; the app still works.
      }
    }

    function render() {
      const markdown = textarea.value.trim() || '# Markmap';
      count.textContent = `${textarea.value.length} caracteres`;
      saveMarkdown(textarea.value);
      try {
        const { root } = transformer.transform(markdown);
        mm.setData(root);
        mm.fit();
        setStatus('');
      } catch (error) {
        setStatus(error.message || 'No se pudo renderizar el mapa.', true);
      }
    }

    function scheduleRender() {
      clearTimeout(renderTimer);
      renderTimer = setTimeout(render, 180);
    }

    function loadInitialMarkdown() {
      try {
        return localStorage.getItem('markmap-repl-markdown') || sample;
      } catch (error) {
        return sample;
      }
    }

    function downloadSvg() {
      const serializer = new XMLSerializer();
      const source = serializer.serializeToString(svg);
      const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'markmap.svg';
      document.body.append(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    textarea.value = loadInitialMarkdown();
    textarea.addEventListener('input', scheduleRender);
    document.querySelector('#fit').addEventListener('click', () => mm.fit());
    document.querySelector('#reset').addEventListener('click', () => {
      textarea.value = sample;
      render();
      textarea.focus();
    });
    document.querySelector('#download').addEventListener('click', downloadSvg);
    window.addEventListener('resize', () => mm.fit());
    render();
  </script>
</body>
</html>

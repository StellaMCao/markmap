<html lang="en">
  <head>
    <meta charset="UTF-8" />

  <!-- MEDIA MODAL INJECT START -->
    <script>
      (function() {
        // Add custom styles for the modal
        const style = document.createElement('style');
        style.innerHTML = `
          .media-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
          }
          .media-modal-box {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            width: 90%;
            max-width: 460px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #1e293b;
          }
          .media-modal-box.dark {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f8fafc;
          }
          .media-modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            font-size: 1.1rem;
          }
          .media-modal-box.dark .media-modal-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
          }
          .media-modal-close {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: inherit;
            opacity: 0.7;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
          }
          .media-modal-close:hover {
            opacity: 1;
          }
          .media-modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            max-height: 70vh;
          }
          .media-modal-form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
          }
          .media-modal-form-group label {
            font-size: 0.88rem;
            font-weight: 500;
          }
          .media-modal-input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: inherit;
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
          }
          .media-modal-box.dark .media-modal-input {
            border: 1px solid #475569;
            background: #1e293b;
          }
          .media-modal-input:focus {
            border-color: #0f766e;
          }
          .media-slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #cbd5e1;
            outline: none;
            margin-top: 4px;
          }
          .media-modal-box.dark .media-slider {
            background: #475569;
          }
          .media-modal-footer {
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.02);
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
          }
          .media-modal-box.dark .media-modal-footer {
            background: rgba(255, 255, 255, 0.02);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
          }
          .media-modal-footer-btns {
            display: flex;
            gap: 10px;
          }
          .media-modal-btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #334155;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
          }
          .media-modal-box.dark .media-modal-btn {
            border: 1px solid #475569;
            background: #334155;
            color: #f8fafc;
          }
          .media-modal-btn-primary {
            background: #0f766e;
            color: #ffffff;
            border-color: #0f766e;
          }
          .media-modal-btn-primary:hover {
            background: #0d9488;
            border-color: #0d9488;
          }
          .media-modal-btn:hover:not(.media-modal-btn-primary) {
            background: #f1f5f9;
          }
          .media-modal-box.dark .media-modal-btn:hover:not(.media-modal-btn-primary) {
            background: #475569;
          }
          .media-drive-img {
            display: block;
            border: 0;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,.08);
            overflow: hidden;
            background: #f1f5f9;
          }
          .media-drive-audio {
            display: block;
            border: 0;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,.08);
            overflow: hidden;
          }
        `;
        document.head.appendChild(style);

        // Define Drive URL Helper Functions
        window.driveFileId = function(url) {
          const trimmed = url.trim();
          const match = trimmed.match(/\/d\/([a-zA-Z0-9_-]+)/) || trimmed.match(/[?&]id=([a-zA-Z0-9_-]+)/);
          return match?.[1] || '';
        };

        window.directDriveUrl = function(url, type) {
          const trimmed = url.trim();
          const id = window.driveFileId(trimmed);
          if (!id) return trimmed;
          if (type === 'image') return 'https://drive.google.com/thumbnail?id=' + id + '&sz=w1000';
          if (type === 'preview') return 'https://drive.google.com/file/d/' + id + '/preview';
          return 'https://drive.google.com/uc?export=download&id=' + id;
        };

        // Create Media Modal function
        window.createMediaModal = function(opts) {
          document.getElementById('media-modal')?.remove();

          // Detect dark theme from parent nodes
          const isDark = (function() {
            const el = document.querySelector('.editor-pane') || document.querySelector('.mindmap-pane') || document.body;
            if (el) {
              const bg = window.getComputedStyle(el).backgroundColor;
              const rgb = bg.match(/\d+/g);
              if (rgb && rgb.length >= 3) {
                const brightness = (parseInt(rgb[0]) * 299 + parseInt(rgb[1]) * 587 + parseInt(rgb[2]) * 114) / 1000;
                return brightness < 128;
              }
            }
            return false;
          })();

          const overlay = document.createElement('div');
          overlay.id = 'media-modal';
          overlay.className = 'media-modal-overlay';

          const modal = document.createElement('div');
          modal.className = 'media-modal-box' + (isDark ? ' dark' : '');

          let html = '<div class="media-modal-header"><span>' + opts.title + '</span><button class="media-modal-close" id="media-modal-close-btn">&#x2715;</button></div><div class="media-modal-body">';

          opts.fields.forEach(function(field) {
            html += '<div class="media-modal-form-group">';
            if (field.type === 'text' || field.type === 'url') {
              html += '<label for="mmf-' + field.key + '">' + field.label + '</label><input id="mmf-' + field.key + '" class="media-modal-input" type="' + field.type + '" value="' + (field.default || '') + '" placeholder="' + (field.placeholder || '') + '">';
            } else if (field.type === 'slider') {
              html += '<label for="mmf-' + field.key + '">' + field.label + ': <strong id="mmf-' + field.key + '-val">' + field.default + '</strong>px</label><input id="mmf-' + field.key + '" class="media-slider" type="range" min="' + field.min + '" max="' + field.max + '" step="' + (field.step || 10) + '" value="' + field.default + '">';
            } else if (field.type === 'select') {
              const optionsHtml = field.options.map(function(o) {
                return '<option value="' + o.value + '"' + (o.value === field.default ? ' selected' : '') + '>' + o.label + '</option>';
              }).join('');
              html += '<label for="mmf-' + field.key + '">' + field.label + '</label><select id="mmf-' + field.key + '" class="media-modal-input" style="padding: 8px;">' + optionsHtml + '</select>';
            }
            html += '</div>';
          });

          html += '</div><div class="media-modal-footer"><div>' + (opts.showLocalUpload ? '<button class="media-modal-btn" id="media-modal-upload-btn">&#x1F4C1; Subir de PC</button>' : '') + '</div><div class="media-modal-footer-btns"><button class="media-modal-btn" id="media-modal-cancel-btn">Cancelar</button><button class="media-modal-btn media-modal-btn-primary" id="media-modal-ok-btn">Insertar</button></div></div>';

          modal.innerHTML = html;
          overlay.appendChild(modal);
          document.body.appendChild(overlay);

          // Wire slider live preview
          opts.fields.filter(function(f) { return f.type === 'slider'; }).forEach(function(field) {
            const slider = document.getElementById('mmf-' + field.key);
            const valEl = document.getElementById('mmf-' + field.key + '-val');
            if (slider && valEl) {
              slider.addEventListener('input', function() { valEl.textContent = slider.value; });
            }
          });

          function getValues() {
            const result = {};
            opts.fields.forEach(function(field) {
              const el = document.getElementById('mmf-' + field.key);
              result[field.key] = el ? el.value : field.default;
            });
            return result;
          }

          const closeModal = function() { overlay.remove(); };

          document.getElementById('media-modal-cancel-btn').addEventListener('click', closeModal);
          document.getElementById('media-modal-close-btn').addEventListener('click', closeModal);
          if (opts.showLocalUpload) {
            document.getElementById('media-modal-upload-btn').addEventListener('click', function() {
              opts.onLocalUpload();
              closeModal();
            });
          }
          overlay.addEventListener('click', function(e) { if (e.target === overlay) closeModal(); });
          document.getElementById('media-modal-ok-btn').addEventListener('click', function() {
            opts.onConfirm(getValues());
            closeModal();
          });

          setTimeout(function() { document.querySelector('#media-modal .media-modal-input')?.focus(); }, 50);
        };

        // window.insertMarkmap2Image
        window.insertMarkmap2Image = function(editorRef, fileInputRef) {
          window.createMediaModal({
            title: '🖼️ Insertar Imagen',
            fields: [
              { key: 'url', type: 'url', label: 'URL de imagen o enlace de Drive', placeholder: 'https://... o https://drive.google.com/...' },
              { key: 'alt', type: 'text', label: 'Texto alternativo', default: 'Imagen', placeholder: 'Descripción de la imagen' },
              { key: 'width', type: 'slider', label: 'Ancho (px)', min: 80, max: 800, step: 20, default: 280 },
              { key: 'aspect', type: 'select', label: 'Proporción (solo Drive)', default: '0.72',
                options: [
                  { value: '0.56', label: '16:9 (panorámica)' },
                  { value: '0.72', label: '4:3 (estándar)' },
                  { value: '1',    label: '1:1 (cuadrada)' },
                  { value: '1.33', label: '3:4 (vertical)' }
                ]
              }
            ],
            showLocalUpload: true,
            onLocalUpload: function() { fileInputRef.current?.click(); },
            onConfirm: function(values) {
              const url = values.url;
              const alt = values.alt;
              const width = values.width;
              const aspect = values.aspect;
              if (!url.trim()) return;
              const w = Math.max(80, Math.min(800, Number(width)));
              const h = Math.round(w * Number(aspect));
              const id = window.driveFileId(url.trim());
              const embed = id
                ? '<iframe class="media-drive-img" src="' + window.directDriveUrl(url, 'preview') + '" allow="autoplay" title="' + alt + '" style="width:' + w + 'px;height:' + h + 'px"></iframe>'
                : '<span class="media-image" style="display:inline-block;width:' + w + 'px"><img src="' + url.trim() + '" alt="' + alt + '" loading="lazy"></span>';
              editorRef.current?.insertAtCursor('\n- ' + (alt || 'Imagen') + '\n  <div class="media-node media-img-node">' + embed + '</div>\n');
            }
          });
        };

        // window.insertMarkmap2Audio
        window.insertMarkmap2Audio = function(editorRef, fileInputRef) {
          window.createMediaModal({
            title: '🎵 Insertar Audio',
            fields: [
              { key: 'url', type: 'url', label: 'URL de audio o enlace de Drive', placeholder: 'https://... o https://drive.google.com/...' },
              { key: 'label', type: 'text', label: 'Título del audio', default: 'Audio', placeholder: 'Nombre del audio' },
              { key: 'width', type: 'slider', label: 'Ancho del reproductor (px)', min: 180, max: 600, step: 20, default: 300 }
            ],
            showLocalUpload: true,
            onLocalUpload: function() { fileInputRef.current?.click(); },
            onConfirm: function(values) {
              const url = values.url;
              const label = values.label;
              const width = values.width;
              if (!url.trim()) return;
              const w = Math.max(180, Math.min(600, Number(width)));
              const id = window.driveFileId(url.trim());
              const embed = id
                ? '<iframe class="media-drive-audio" src="' + window.directDriveUrl(url, 'preview') + '" allow="autoplay" title="' + label + '" style="width:' + w + 'px"></iframe>'
                : '<audio controls preload="metadata" src="' + window.directDriveUrl(url) + '" style="width:' + w + 'px"></audio>';
              editorRef.current?.insertAtCursor('\n- ' + (label || 'Audio') + '\n  <div class="media-node media-audio-node">' + embed + '</div>\n');
            }
          });
        };

      })();
    </script>
<!-- MEDIA MODAL INJECT END --></head>
  <body>
    <div id="root"></div>
  </body>
</html>
